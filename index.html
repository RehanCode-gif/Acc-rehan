<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Roblox Account Manager</title>

    <link rel="stylesheet" href="style.css">
</head>


<body>

<div class="container">

    <h1>Roblox Account Manager</h1>


    <div class="form-box">

        <input 
        type="text" 
        id="username" 
        placeholder="Username Roblox">


        <input 
        type="password" 
        id="password" 
        placeholder="Password">


        <input 
        type="email" 
        id="gmail" 
        placeholder="Gmail">


        <button onclick="addAccount()">
            Tambah Akun
        </button>

    </div>


    <h2>Daftar Akun</h2>


    <div id="accountList">

    </div>


</div>


<script src="script.js"></script>

</body>

</html>
