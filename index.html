<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roblox Account Storage</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>🎮 Roblox Account Storage</h1>
    <p class="subtitle">Simpan akun Roblox kamu dengan aman</p>

    <div class="form-box">

        <input type="text" id="username" placeholder="Username Roblox (contoh: rayhan)">

        <input type="password" id="password" placeholder="Password Roblox">

        <input type="email" id="gmail" placeholder="Gmail (contoh: ra*****@gmail.com)">

        <textarea id="keterangan" placeholder="Keterangan akun"></textarea>

        <button onclick="tambahAkun()">Tambah Akun</button>

    </div>


    <h2>Daftar Akun</h2>

    <div id="listAkun"></div>

</div>


<script src="script.js"></script>

</body>
</html>
